<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Aid App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">CPR</h1>
    <div class="video-container">
        <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/-NodDRTsV88?si=ODCNA1E26_q80gM0"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
    </div>

    <div class="quiz-container hidden">
    
    <form id="quizForm">
        <!-- Question 1 -->
        <div class="question-block" id="q1-block">
            <p>1. For how many maximum seconds should you check for breathing and signs of life?</p>
            <label><input type="radio" name="q1" value="a"> 5 seconds</label>
            <label><input type="radio" name="q1" value="b" data-correct="true"> 10 seconds</label>
            <label><input type="radio" name="q1" value="c"> 15 seconds</label>
            <label><input type="radio" name="q1" value="d"> 20 seconds</label>
        </div>

        <!-- Question 2 -->
        <div class="question-block" id="q2-block">
            <p>2. What is the correct depth for adult chest compressions?</p>
            <label><input type="radio" name="q2" value="b"> 1 inch</label>
            <label><input type="radio" name="q2" value="a" data-correct="true"> 2 inches</label>
            <label><input type="radio" name="q2" value="c"> 3 inches</label>
            <label><input type="radio" name="q2" value="d"> 4 inches</label>
        </div>

        <!-- Question 3 -->
        <div class="question-block" id="q3-block">
            <p>3. What is the correct ratio of chest compressions to rescue breaths for an adult?</p>
            <label><input type="radio" name="q3" value="a"> 15 compressions, 1 breath</label>
            <label><input type="radio" name="q3" value="b"> 15 compressions, 2 breaths</label>
            <label><input type="radio" name="q3" value="c"> 30 compressions, 1 breath</label>
            <label><input type="radio" name="q3" value="d" data-correct="true"> 30 compressions, 2 breaths</label>
        </div>

        <div class="btn-container">
            <button type="button" onclick="submitQuiz()">Submit Answers</button>
        </div>
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
